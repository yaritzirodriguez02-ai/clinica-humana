<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinica Humana — Bienvenida</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #0b1424; position: relative; overflow-x: hidden; }

        .fachada { position: fixed; inset: 0; z-index: 0; background:
            repeating-linear-gradient(90deg, rgba(225,228,235,0.06) 0px, rgba(225,228,235,0.10) 2px, transparent 2px, transparent 40px),
            repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 26px),
            radial-gradient(120% 70% at 50% 88%, rgba(30,60,45,0.55) 0%, rgba(20,40,32,0.35) 60%, transparent 72%),
            linear-gradient(180deg, rgba(214,90,55,0.55) 0%, rgba(214,90,55,0.35) 60%, transparent 100%) 0% 0% / 22% 70% no-repeat,
            linear-gradient(180deg, rgba(180,185,196,0.25) 0%, rgba(120,125,135,0.18) 60%, rgba(70,76,86,0.10) 100%); }

        .letrero { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); z-index: 1; text-align: center; color: #2f7ffc; text-shadow: 0 2px 0 rgba(12,20,40,0.55), 0 1px 2px rgba(0,0,0,0.4); letter-spacing: 0.02em; user-select: none; }
        .letrero .cross { display: inline-block; width: 1.1rem; height: 1.1rem; border: 2.5px solid currentColor; border-radius: 2px; vertical-align: middle; margin-right: 0.55rem; position: relative; }
        .letrero .cross::before, .letrero .cross::after { content: ""; position: absolute; background: currentColor; }
        .letrero .cross::before { left: 50%; top: 0; bottom: 0; width: 2.5px; transform: translateX(-50%); }
        .letrero .cross::after { top: 50%; left: 0; right: 0; height: 2.5px; transform: translateY(-50%); }
        .letrero .cruz { font-size: 3.6rem; line-height: 1; font-weight: 700; font-family: Georgia, serif; opacity: 0.95; }
        .letrero .nombre { display: block; font-size: 4.2rem; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 0.1rem; }
        .letrero .nombre b { font-weight: 700; }

        .burbujas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .burbuja { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 70%, rgba(255,255,255,0.05)); box-shadow: inset 0 -4px 10px rgba(0,0,0,0.25), inset 0 4px 14px rgba(255,255,255,0.7), 0 8px 22px rgba(0,0,0,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0b1424; font-weight: 700; text-align: center; pointer-events: auto; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease; will-change: transform; backdrop-filter: blur(1px); text-decoration: none; }
        .burbuja:hover { transform: scale(1.06); box-shadow: inset 0 -4px 10px rgba(0,0,0,0.25), inset 0 4px 14px rgba(255,255,255,0.85), 0 12px 28px rgba(0,0,0,0.45); }
        .burbuja .icono { font-size: 2.4rem; line-height: 1; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }
        .burbuja .label { font-size: 0.95rem; letter-spacing: 0.04em; margin-top: 0.4rem; text-transform: uppercase; display: block; font-weight: 600; text-shadow: 0 1px 2px rgba(255,255,255,0.55); }

        .burbuja-odontologia { width: 150px; height: 150px; left: 10%; top: 44%; background: radial-gradient(circle at 35% 30%, #7fe0ff, #1b8fe0 70%, #0b5bb0); color: #04233a; }
        .burbuja-odontologia .icono::before { content: "🦷"; }
        .burbuja-pediatria { width: 150px; height: 150px; right: 12%; top: 36%; background: radial-gradient(circle at 35% 30%, #ffd9a8, #ff9d4d 70%, #d8631a); color: #3a1605; }
        .burbuja-pediatria .icono::before { content: "🩺"; }
        .burbuja-recepcion { width: 170px; height: 170px; left: 50%; top: 60%; transform: translateX(-50%); background: radial-gradient(circle at 35% 30%, #e8eef7, #a9c0dc 70%, #5f7fa0); color: #0b1726; box-shadow: inset 0 -4px 10px rgba(0,0,0,0.25), inset 0 4px 14px rgba(255,255,255,0.7), 0 8px 22px rgba(0,0,0,0.35), 0 0 0 3px rgba(255,255,255,0.15); }
        .burbuja-recepcion:hover { transform: translateX(-50%) scale(1.06); }
        .burbuja-recepcion .icono::before { content: "🏥"; font-size: 2.6rem; }
        .burbuja-recepcion .label { font-size: 1.05rem; }

        .sub { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 2; color: rgba(255,255,255,0.75); font-size: 0.95rem; letter-spacing: 0.06em; text-shadow: 0 1px 3px rgba(0,0,0,0.55); text-align: center; white-space: nowrap; }

        .odontograma { position: absolute; right: 22px; bottom: 22px; z-index: 2; background: rgba(10,18,30,0.7); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.18); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
        .odontograma .titulo { color: rgba(255,255,255,0.85); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
        .odontograma .dientes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 104px; }
        .diente { aspect-ratio: 1 / 1.15; border-radius: 4px 4px 6px 6px; background: linear-gradient(180deg, #f0e6cf 0%, #d8c29e 100%); box-shadow: inset 0 -2px 4px rgba(0,0,0,0.18), inset 0 2px 3px rgba(255,255,255,0.6); border: 1px solid rgba(120,90,55,0.4); transition: transform 0.2s ease, background 0.2s ease; cursor: pointer; }
        .diente.activo { background: linear-gradient(180deg, #bfe3ff 0%, #7fc3e8 100%); box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15), inset 0 2px 3px rgba(255,255,255,0.7), 0 0 0 2px #3a8fd4; }
        .diente:hover { transform: translateY(-3px); background: linear-gradient(180deg, #cfe6ff 0%, #8fc9f0 100%); }
        .diente.activo:hover { background: linear-gradient(180deg, #d6f0ff 0%, #9fd3f2 100%); }
        .odontograma .admin-link { color: #9fd3f2; font-size: 0.62rem; letter-spacing: 0.08em; text-decoration: none; text-transform: uppercase; font-weight: 600; text-align: center; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 6px; width: 100%; transition: color 0.2s ease, background 0.2s ease; border-radius: 4px; cursor: pointer; }
        .odontograma .admin-link:hover { color: #ffffff; background: rgba(255,255,255,0.08); }

        @media (max-width: 640px) {
            .letrero .nombre { font-size: 2.6rem; }
            .letrero .cruz { font-size: 2.4rem; }
            .burbuja-odontologia, .burbuja-pediatria { width: 110px; height: 110px; }
            .burbuja-odontologia .icono, .burbuja-pediatria .icono { font-size: 1.8rem; }
            .burbuja-recepcion { width: 120px; height: 120px; }
            .burbuja-recepcion .icono { font-size: 2rem; }
            .sub { font-size: 0.8rem; bottom: 80px; }
            .odontograma { right: 12px; bottom: 12px; padding: 10px 10px; }
            .odontograma .dientes { width: 80px; }
        }
    </style>
</head>
<body>
    <div class="fachada" aria-hidden="true"></div>

    <div class="letrero">
        <span class="cruz"><span class="cross" aria-hidden="true"></span></span>
        <span class="nombre"><b>Clinic</b>a Humana</span>
    </div>

    <div class="burbujas">
        <a th:href="@{/entrar/ODONTOLOGIA}" class="burbuja burbuja-odontologia" aria-label="Ingresar como odontólogo">
            <span class="icono" aria-hidden="true"></span>
            <span class="label">Odontología</span>
        </a>
        <a th:href="@{/entrar/PEDIATRIA}" class="burbuja burbuja-pediatria" aria-label="Ingresar como pediatra">
            <span class="icono" aria-hidden="true"></span>
            <span class="label">Pediatría</span>
        </a>
        <a th:href="@{/entrar/recepcion}" class="burbuja burbuja-recepcion" aria-label="Ingresar como recepcionista">
            <span class="icono" aria-hidden="true"></span>
            <span class="label">Recepción · Unida</span>
        </a>
    </div>

    <div class="sub">Elige tu especialidad para continuar</div>

    <div class="odontograma" role="group" aria-label="Acceso administrativo">
        <span class="titulo">Administración</span>
        <div class="dientes" aria-hidden="true">
            <div th:each="i : ${#numbers.sequence(1, 15)}"
                 th:classappend="${i % 3 != 0} ? 'activo'"
                 class="diente"></div>
        </div>
        <!-- Ajusta esta ruta si tu acceso de administración es otro -->
        <a th:href="@{/entrar/admin}" class="admin-link">Ingresar</a>
    </div>
</body>
</html>
