<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal y Empleados - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Barra de Navegación Global Unificada -->
    <div th:replace="~{fragments/navbar :: barraNavegacion}"></div>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Notificaciones -->
        <div th:if="${mensajeExito}" class="mb-6 p-4 bg-emerald-100 border-l-4 border-emerald-500 text-emerald-800 rounded shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-600"></i>
            <span th:text="${mensajeExito}"></span>
        </div>
        <div th:if="${mensajeError}" class="mb-6 p-4 bg-rose-100 border-l-4 border-rose-500 text-rose-800 rounded shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-rose-600"></i>
            <span th:text="${mensajeError}"></span>
        </div>

        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Personal y Cuentas de Acceso</h2>
                <p class="text-xs text-slate-500">Médicos especialistas, auxiliares de recepción y administración.</p>
            </div>
            <a th:href="@{/empleados/nuevo}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold shadow flex items-center gap-2 transition">
                <i class="fa-solid fa-user-plus"></i> Registrar Colaborador
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="py-3 px-4 font-semibold">ID</th>
                            <th class="py-3 px-4 font-semibold">Nombre Completo</th>
                            <th class="py-3 px-4 font-semibold">Cargo / Puesto</th>
                            <th class="py-3 px-4 font-semibold">Cédula Profesional</th>
                            <th class="py-3 px-4 font-semibold">Contacto</th>
                            <th class="py-3 px-4 font-semibold">Usuario del Sistema</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        <tr th:each="emp : ${empleados}" class="hover:bg-slate-50 transition">
                            <td class="py-3 px-4 font-mono font-bold text-slate-500" th:text="${emp.idEmpleado}">1</td>
                            <td class="py-3 px-4 font-bold text-slate-900" th:text="${emp.nombre + ' ' + emp.apellidos}">Nombre</td>
                            <td class="py-3 px-4">
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold"
                                      th:classappend="${emp.cargo == 'PEDIATRA'} ? 'bg-amber-100 text-amber-800' : (${emp.cargo == 'ODONTOPEDIATRA'} ? 'bg-teal-100 text-teal-800' : (${emp.cargo == 'RECEPCIONISTA'} ? 'bg-sky-100 text-sky-800' : 'bg-purple-100 text-purple-800'))"
                                      th:text="${emp.cargo}">PEDIATRA</span>
                            </td>
                            <td class="py-3 px-4 font-mono text-xs text-slate-600" th:text="${emp.cedulaProfesional != null and !emp.cedulaProfesional.isEmpty() ? emp.cedulaProfesional : 'N/A'}">5505161</td>
                            <td class="py-3 px-4 text-xs text-slate-600">
                                <div th:if="${emp.telefono}" th:text="'Tel: ' + ${emp.telefono}"></div>
                                <div th:if="${emp.email}" class="text-slate-400" th:text="${emp.email}"></div>
                            </td>
                            <td class="py-3 px-4 font-mono text-xs text-indigo-700 font-bold" th:text="${emp.usuario != null ? emp.usuario.username : 'Sin Usuario'}">usuario</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

</body>
</html>
