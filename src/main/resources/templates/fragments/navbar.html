<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>

<header th:fragment="barraNavegacion" class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            
            <!-- Marca y Nombre del Consultorio -->
            <a th:href="@{/citas}" class="flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-800 rounded-lg flex items-center justify-center text-slate-100 shadow-sm">
                    <img th:src="@{/img/logo-ciso.jpg}" src="/img/logo-ciso.jpg" alt="CISO" class="w-8 h-8 object-contain" onerror="this.style.display='none'">
                    <i class="fa-solid fa-hospital-user text-xl"></i>
                </div>
                <div>
                    <span sec:authorize="hasRole('PEDIATRA')"
                          class="font-extrabold text-base uppercase tracking-tight block leading-tight">Clínica Médica Pediátrica</span>
                    <span sec:authorize="hasAnyRole('ODONTOPEDIATRA', 'ODONTOLOGIA')"
                          class="font-extrabold text-[13px] uppercase tracking-tight block leading-tight">CLIMICA DENTAL-CISO</span>
                    <span sec:authorize="hasAnyRole('ADMIN', 'ADMINISTRADOR', 'RECEPCIONISTA')"
                          class="font-extrabold text-base uppercase tracking-tight block leading-tight">Clínica Humana</span>
                </div>
            </a>

            <!-- Menú central condicionado por rol -->
            <nav class="hidden md:flex items-center gap-1">
                
                <!-- 0. PANEL ADMIN (Solo Administrador) -->
                <a sec:authorize="hasAnyRole('ADMIN', 'ADMINISTRADOR')" 
                   th:href="@{/admin/dashboard}" 
                   class="px-3 py-2 rounded-lg text-xs font-bold hover:bg-indigo-800 transition flex items-center gap-1.5 text-amber-300 bg-amber-950/30 border border-amber-500/30">
                    <i class="fa-solid fa-gauge-high"></i> PANEL ADMIN
                </a>

                <!-- 1. PERSONAL / EMPLEADOS (Solo Administrador) -->
                <a sec:authorize="hasAnyRole('ADMIN', 'ADMINISTRADOR')" 
                   th:href="@{/empleados}" 
                   class="px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-wide hover:bg-blue-900 transition flex items-center gap-1.5 text-blue-100">
                    <i class="fa-solid fa-user-doctor text-blue-300"></i> PERSONAL
                </a>

                <!-- 2. AGENDA / CITAS (Todos la ven, pero filtrada a su rol) -->
                <a th:href="@{/citas}" class="px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-wide hover:bg-blue-900 transition flex items-center gap-1.5 text-blue-100">
                    <i class="fa-solid fa-calendar-days text-blue-300"></i> Mi Agenda
                </a>

                <!-- 3. PACIENTES Y TUTORES -->
                <a th:href="@{/pacientes}" class="px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-wide hover:bg-blue-900 transition flex items-center gap-1.5 text-blue-100">
                    <i class="fa-solid fa-user-injured text-blue-300"></i> Pacientes y Tutores
                </a>

                <!-- 3b. CATÁLOGO DE MEDICAMENTOS (Personal médico y Admin) -->
                <a sec:authorize="hasAnyRole('PEDIATRA', 'ODONTOPEDIATRA', 'ADMIN')"
                   th:href="@{/medicamentos}"
                   class="px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-wide hover:bg-blue-900 transition flex items-center gap-1.5 text-blue-100">
                    <i class="fa-solid fa-pills text-blue-300"></i> Medicamentos
                </a>

                <!-- 4. AGENDAR NUEVA CITA -->
                <a sec:authorize="hasAnyRole('PEDIATRA', 'RECEPCIONISTA', 'ADMIN')"
                   th:href="@{/citas/nueva}" class="px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-wide hover:bg-blue-900 transition flex items-center gap-1.5 text-blue-100">
                    <i class="fa-solid fa-calendar-plus text-blue-300"></i> Agendar Cita
                </a>

                <!-- 5. CONTROL DE CAJA Y COBROS -->
                <a th:href="@{/pagos}" class="px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-wide hover:bg-blue-900 transition flex items-center gap-1.5 text-blue-50 bg-blue-950/30 border border-blue-400/40">
                    <i class="fa-solid fa-cash-register"></i> Caja y Cobros
                </a>

                <!-- 6. CORTE DIARIO / REPORTES FINANCIEROS -->
                <a th:href="@{/pagos/corte}" class="px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-wide hover:bg-blue-900 transition flex items-center gap-1.5 text-blue-100">
                    <i class="fa-solid fa-chart-line text-blue-300"></i> Corte de Caja
                </a>
            </nav>

            <!-- Perfil de Usuario y Logout -->
            <div class="flex items-center gap-3">
                <!-- Logo de especialidad en cabecera, se muestra según rol -->
                <div sec:authorize="hasRole('PEDIATRA')" class="mr-3 shrink-0 hidden md:block">
                    <img th:src="@{/img/logo-pediatra.jpg}" src="/img/logo-pediatra.jpg" alt="Pediatría" class="h-8 w-auto object-contain" onerror="this.style.display='none'">
                </div>
                <div sec:authorize="hasAnyRole('ODONTOPEDIATRA', 'ODONTOLOGIA')" class="mr-3 shrink-0 hidden md:block">
                    <img th:src="@{/img/logo-ciso.jpg}" src="/img/logo-ciso.jpg" alt="Odontología" class="h-8 w-auto object-contain" onerror="this.style.display='none'">
                </div>
                <div class="text-right">
                    <span class="block text-xs font-bold text-white leading-tight" sec:authentication="name">Usuario</span>
                    <span sec:authorize="hasRole('PEDIATRA')" class="bg-amber-100 text-amber-900 text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full inline-block">PEDIATRÍA</span>
                    <span sec:authorize="hasRole('ODONTOPEDIATRA')" class="bg-blue-800/50 text-blue-50 border border-blue-400/40 text-[10px] font-bold uppercase px-2 py-0.5 rounded-full inline-block">CISO Especialista Dental</span>
                    <span sec:authorize="hasRole('RECEPCIONISTA')" class="bg-sky-100 text-sky-900 text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full inline-block">Recepción y Caja</span>
                    <span sec:authorize="hasAnyRole('ADMIN', 'ADMINISTRADOR')" class="bg-purple-100 text-purple-900 text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full inline-block">Administrador General</span>
                </div>

                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" title="Cerrar sesión" class="w-8 h-8 rounded-lg bg-rose-600 hover:bg-rose-700 text-white flex items-center justify-center transition text-xs">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </form>
            </div>

        </div>
    </div>
</header>

</body>
</html>
