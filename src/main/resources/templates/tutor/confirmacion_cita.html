<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita Confirmada - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-slate-200 text-center">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-900 mb-2">¡Cita Registrada!</h2>
        <p class="text-xs text-slate-600 mb-6 leading-relaxed" th:text="${mensajeExito}">
            Tu cita ha sido guardada en la agenda del consultorio.
        </p>

        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-left mb-6 space-y-1 text-slate-700">
            <p><strong>Ubicación:</strong> Av. Lázaro Cárdenas #59, 3er Piso, Col. Haciendita, Chilpancingo, Gro.</p>
            <p><strong>Recomendación:</strong> Presentarse 10 minutos antes de la hora acordada.</p>
        </div>

        <div class="space-y-2">
            <a th:href="@{/portal-citas}" class="block w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition">
                Agendar otra cita
            </a>
            <a th:href="@{/login}" class="block w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-semibold transition">
                Acceso al Sistema Clínico
            </a>
        </div>
    </div>

</body>
</html>
