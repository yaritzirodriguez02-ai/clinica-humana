<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloFormulario}">Atención Pediátrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

<div th:replace="~{fragments/navbar :: barraNavegacion}"></div>

<main class="max-w-5xl mx-auto px-4 mt-8">
    <div th:if="${mensajeExito}" class="mb-6 p-4 bg-emerald-100 border-l-4 border-emerald-500 text-emerald-800 rounded shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-600"></i>
            <span th:text="${mensajeExito}"></span>
        </div>
    </div>
    <div th:if="${mensajeError}" class="mb-6 p-4 bg-rose-100 border-l-4 border-rose-500 text-rose-800 rounded shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-rose-600"></i>
            <span th:text="${mensajeError}"></span>
        </div>
    </div>        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-start gap-4">
        <div>
            <span class="text-xs font-semibold text-indigo-600 uppercase">Paciente</span>
            <h2 class="text-xl font-bold text-slate-900" th:text="${expediente.paciente?.nombre != null ? (expediente.paciente.nombre + ' ' + expediente.paciente.apellidos) : ''}"></h2>
            <p class="text-xs text-slate-500 font-mono" th:text="${expediente.paciente?.curp != null ? ('CURP: ' + expediente.paciente.curp + ' | Nacimiento: ' + expediente.paciente.fechaNacimiento) : ''}"></p>
        </div>
        <div class="bg-slate-100 px-4 py-2 rounded-lg text-sm">
            <span class="font-semibold text-slate-700">Tutor:</span>
            <span th:text="${expediente.paciente?.tutor?.nombre != null ? (expediente.paciente.tutor.nombre + ' ' + expediente.paciente.tutor.apellidos + ' (' + expediente.paciente.tutor.telefono + ')') : ''}"></span>
        </div>
    </div>

    <div th:if="${errorAcceso}" class="mb-6 p-4 bg-amber-100 border-l-4 border-amber-500 text-amber-800 rounded shadow-sm flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
        <span th:text="${errorAcceso}"></span>
    </div>

    <form th:action="${urlAction}" th:object="${expediente}" method="post" class="space-y-6">
        <input type="hidden" th:field="*{idExpedientePed}" />
        <input type="hidden" name="idPaciente" th:value="${idPaciente}" />
        <input type="hidden" th:if="${expediente.idExpedientePed != null}" th:field="*{cita.idCita}" />
        <input type="hidden" th:field="*{paciente.idPaciente}" />
        <input type="hidden" th:field="*{medico.idUsuario}" />

        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-notes-medical text-indigo-600"></i> Datos de la Atención
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Diagnóstico Médico *</label>
                    <textarea th:field="*{diagnostico}" rows="3" required
                              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                    <span th:if="${#fields.hasErrors('diagnostico')}" th:errors="*{diagnostico}" class="text-xs text-rose-500"></span>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tratamiento Indicado *</label>
                    <textarea th:field="*{tratamiento}" rows="3" required
                              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                    <span th:if="${#fields.hasErrors('tratamiento')}" th:errors="*{tratamiento}" class="text-xs text-rose-500"></span>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Peso (kg) *</label>
                    <input type="number" step="0.01" min="1.00" max="100.00" th:field="*{peso}" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Talla (cm) *</label>
                    <input type="number" step="0.01" min="40.00" max="200.00" th:field="*{talla}" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Temperatura (°C) *</label>
                    <input type="number" step="0.1" min="35.0" max="42.0" th:field="*{temperatura}" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Presión Arterial</label>
                    <input type="text" pattern="^[0-9]{2,3}/[0-9]{2,3}$" th:field="*{presionArterial}" placeholder="Ej. 110/70"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-3">
            <a th:href="${linkVolver}" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition">
                Cancelar
            </a>
            <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                <i class="fa-solid fa-check"></i> Guardar Atención
            </button>
        </div>
    </form>
</main>

</body>
</html>
