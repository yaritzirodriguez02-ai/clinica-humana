<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Odontopediátrica - Dra. Gloria González</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

    <header class="bg-teal-700 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-tooth text-teal-200"></i>
                    Atención Dental Odontopediátrica
                </h1>
                <span class="text-xs text-teal-200" th:text="'Especialista: ' + ${expediente.medico.nombreCompleto}"></span>
            </div>
            <a th:href="@{/citas}" class="text-sm bg-teal-800 hover:bg-teal-900 px-3 py-1.5 rounded-lg border border-teal-500 transition">
                <i class="fa-solid fa-arrow-left"></i> Volver a Citas
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-8">
        
        <!-- Ficha del Paciente -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
            <div>
                <span class="text-xs font-semibold text-teal-600 uppercase">Paciente Infantil</span>
                <h2 class="text-xl font-bold text-slate-900" th:text="${expediente.paciente.nombre + ' ' + expediente.paciente.apellidos}"></h2>
                <p class="text-xs text-slate-500 font-mono" th:text="'CURP: ' + ${expediente.paciente.curp} + ' | Nacimiento: ' + ${expediente.paciente.fechaNacimiento}"></p>
            </div>
            <div class="bg-slate-100 px-4 py-2 rounded-lg text-sm">
                <span class="font-semibold text-slate-700">Tutor:</span>
                <span th:text="${expediente.paciente.tutor.nombre + ' ' + expediente.paciente.tutor.apellidos}"></span>
            </div>
        </div>

        <form th:action="@{/consultas/odontopediatria/guardar}" th:object="${expediente}" method="post" class="space-y-6">
            <input type="hidden" th:field="*{cita.idCita}" />
            <input type="hidden" th:field="*{paciente.idPaciente}" />
            <input type="hidden" th:field="*{medico.idUsuario}" />

            <!-- BLOQUE EVALUACIÓN DENTAL -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-teeth text-teal-600"></i> Procedimiento Bucodental
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Diagnóstico Bucal *</label>
                        <textarea th:field="*{diagnosticoDental}" rows="2" required
                                  placeholder="Caries, anomalías de erupción, mordida, profilaxis requerida..."
                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Piezas Dentales Tratadas</label>
                        <input type="text" th:field="*{piezasTratadas}" placeholder="Ej. 54, 55, 64 (Nomenclatura FDI) o dientes de leche temporales"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Procedimientos Realizados *</label>
                        <textarea th:field="*{procedimientosRealizados}" rows="3" required
                                  placeholder="Resina compuesta, pulpotomía, selladores, aplicación de flúor..."
                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Recomendaciones de Higiene Dental</label>
                        <textarea th:field="*{recomendacionesHigiene}" rows="2"
                                  placeholder="Técnica de cepillado recomendada para el tutor e infante..."
                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Costo del Tratamiento ($ MXN) *</label>
                        <input type="number" step="0.50" min="0.00" th:field="*{costoTratamiento}" required placeholder="500.00"
                               class="w-full sm:w-64 px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-teal-500">
                    </div>
                </div>
            </div>

            <!-- BLOQUE FIRMA DIGITAL -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-base font-bold text-slate-900 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-signature text-teal-600"></i> Firma Digital del Especialista *
                </h3>
                <p class="text-xs text-slate-500 mb-3">Firma en el recuadro para certificar el procedimiento odontológico.</p>
                <div class="border-2 border-dashed border-slate-300 rounded-lg p-2 inline-block bg-slate-50">
                    <canvas id="canvasFirma" width="450" height="150" class="bg-white rounded cursor-crosshair border border-slate-200"></canvas>
                </div>
                <div class="mt-2">
                    <button type="button" onclick="limpiarFirma()" class="text-xs text-rose-600 hover:text-rose-800 font-semibold">
                        <i class="fa-solid fa-eraser"></i> Borrar Firma
                    </button>
                </div>
                <input type="hidden" id="firmaBase64" th:field="*{firmaMedicoBase64}" required />
            </div>

            <div class="flex justify-end gap-3">
                <a th:href="@{/citas}" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition">
                    Cancelar
                </a>
                <button type="submit" onclick="guardarFirmaAntesDeEnviar(event)"
                        class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Finalizar y Guardar Consulta
                </button>
            </div>
        </form>
    </main>

    <script>
        const canvas = document.getElementById('canvasFirma');
        const ctx = canvas.getContext('2d');
        let dibujando = false;

        ctx.strokeStyle = '#0f766e';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        function pos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left,
                y: (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top
            };
        }

        function empezar(e) {
            dibujando = true;
            const p = pos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            e.preventDefault();
        }

        function dibujar(e) {
            if (!dibujando) return;
            const p = pos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            e.preventDefault();
        }

        function detener() {
            dibujando = false;
        }

        canvas.addEventListener('mousedown', empezar);
        canvas.addEventListener('mousemove', dibujar);
        window.addEventListener('mouseup', detener);

        canvas.addEventListener('touchstart', empezar);
        canvas.addEventListener('touchmove', dibujar);
        window.addEventListener('touchend', detener);

        function limpiarFirma() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('firmaBase64').value = '';
        }

        function guardarFirmaAntesDeEnviar(e) {
            const dataUrl = canvas.toDataURL('image/png');
            document.getElementById('firmaBase64').value = dataUrl;
        }
    </script>
</body>
</html>
