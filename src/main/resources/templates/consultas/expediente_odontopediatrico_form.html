<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloFormulario}">Atención Odontopediátrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

<div th:replace="~{fragments/navbar :: barraNavegacion}"></div>

<main class="max-w-5xl mx-auto px-4 mt-8">
    <div th:if="${mensajeExito}" class="mb-6 p-4 bg-emerald-100 border-l-4 border-emerald-500 text-emerald-800 rounded shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-600"></i>
            <span th:text="${mensajeExito}"></span>
        </div>
    </div>
    <div th:if="${mensajeError}" class="mb-6 p-4 bg-rose-100 border-l-4 border-rose-500 text-rose-800 rounded shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-rose-600"></i>
            <span th:text="${mensajeError}"></span>
        </div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-start gap-4">
        <div>
            <span class="text-xs font-semibold text-teal-600 uppercase">Paciente</span>
            <h2 class="text-xl font-bold text-slate-900" th:text="${expediente.paciente.nombre + ' ' + expediente.paciente.apellidos}"></h2>
            <p class="text-xs text-slate-500 font-mono" th:text="${'CURP: ' + expediente.paciente.curp + ' | Nacimiento: ' + expediente.paciente.fechaNacimiento}"></p>
        </div>
        <div class="bg-slate-100 px-4 py-2 rounded-lg text-sm">
            <span class="font-semibold text-slate-700">Tutor:</span>
            <span th:text="${expediente.paciente.tutor.nombre + ' ' + expediente.paciente.tutor.apellidos}"></span>
        </div>
    </div>

    <div th:if="${errorAcceso}" class="mb-6 p-4 bg-amber-100 border-l-4 border-amber-500 text-amber-800 rounded shadow-sm flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
        <span th:text="${errorAcceso}"></span>
    </div>

    <form th:action="${urlAction}" th:object="${expediente}" method="post" class="space-y-6">
        <input type="hidden" th:field="*{idExpedienteOdonto}" />
        <input type="hidden" name="idPaciente" th:value="${idPaciente}" />
        <div th:if="${expediente.idExpedienteOdonto == null}" class="mb-4">
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Cita asociada *</label>
            <select th:field="*{cita.idCita}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500">
                <option value="">-- Seleccione una cita --</option>
                <option th:each="c : ${citasDisponibles}" th:value="${c.idCita}" th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy') + ' ' + ${c.hora} + ' - ' + ${c.paciente.nombre} + ' ' + ${c.paciente.apellidos}}"></option>
            </select>
            <span th:if="${sinCitasDisponibles}" class="text-xs text-rose-600 mt-1 block">
                <i class="fa-solid fa-circle-exclamation"></i> No hay citas disponibles para registrar un nuevo expediente. Si desea crear uno, agende una cita primero.
            </span>
        </div>
        <input type="hidden" th:if="${expediente.idExpedienteOdonto != null}" th:field="*{cita.idCita}" />
        <input type="hidden" th:field="*{paciente.idPaciente}" />
        <input type="hidden" th:field="*{medico.idUsuario}" />

        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-teeth text-teal-600"></i> Datos de la Atención Dental
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Diagnóstico Dental *</label>
                    <textarea th:field="*{diagnosticoDental}" rows="2" required
                              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500"></textarea>
                    <span th:if="${#fields.hasErrors('diagnosticoDental')}" th:errors="*{diagnosticoDental}" class="text-xs text-rose-500"></span>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Piezas Dentales Tratadas</label>
                    <input type="text" th:field="*{piezasTratadas}" placeholder="Ej. 54, 55, 64 (FDI)"
                             class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Procedimientos Realizados *</label>
                    <textarea th:field="*{procedimientosRealizados}" rows="3" required
                              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500"></textarea>
                    <span th:if="${#fields.hasErrors('procedimientosRealizados')}" th:errors="*{procedimientosRealizados}" class="text-xs text-rose-500"></span>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Recomendaciones de Higiene Dental</label>
                    <textarea th:field="*{recomendacionesHigiene}" rows="2"
                              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Costo del Tratamiento ($ MXN) *</label>
                    <input type="number" step="0.50" min="0.00" th:field="*{costoTratamiento}" required placeholder="500.00"
                           class="w-full sm:w-64 px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold text-slate-900 focus:ring-2 focus:ring-teal-500">
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-3">
            <a th:href="${linkVolver}" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition">
                Cancelar
            </a>
            <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                <i class="fa-solid fa-check"></i> Guardar Atención
            </button>
        </div>
    </form>
</main>

</body>
</html>
