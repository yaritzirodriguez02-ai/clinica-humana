<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Médica Pediátrica - Dra. Pilar Ríos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-stethoscope text-indigo-200"></i>
                    Atención Médica Pediátrica
                </h1>
                <span class="text-xs text-indigo-200" th:text="'Médico: ' + ${expediente.medico.nombreCompleto}"></span>
            </div>
            <a th:href="@{/citas}" class="text-sm bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-500 transition">
                <i class="fa-solid fa-arrow-left"></i> Volver a Citas
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-8">
        
        <!-- Ficha Rápida del Paciente -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
            <div>
                <span class="text-xs font-semibold text-indigo-600 uppercase">Paciente Infantil</span>
                <h2 class="text-xl font-bold text-slate-900" th:text="${expediente.paciente.nombre + ' ' + expediente.paciente.apellidos}"></h2>
                <p class="text-xs text-slate-500 font-mono" th:text="'CURP: ' + ${expediente.paciente.curp} + ' | Nacimiento: ' + ${expediente.paciente.fechaNacimiento}"></p>
            </div>
            <div class="bg-slate-100 px-4 py-2 rounded-lg text-sm">
                <span class="font-semibold text-slate-700">Tutor:</span>
                <span th:text="${expediente.paciente.tutor.nombre + ' ' + expediente.paciente.tutor.apellidos + ' (' + expediente.paciente.tutor.telefono + ')'}"></span>
            </div>
        </div>

        <form th:action="@{/consultas/pediatria/guardar}" th:object="${expediente}" method="post" class="space-y-6">
            <input type="hidden" th:field="*{cita.idCita}" />
            <input type="hidden" th:field="*{paciente.idPaciente}" />
            <input type="hidden" th:field="*{medico.idUsuario}" />

            <!-- BLOQUE SOMATOMETRÍA -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-weight-scale text-indigo-600"></i> Somatometría y Signos Vitales
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Peso (kg) *</label>
                        <input type="number" step="0.01" min="1.00" max="100.00" th:field="*{peso}" required
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Talla (cm) *</label>
                        <input type="number" step="0.01" min="40.00" max="100.00" th:field="*{talla}" required
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Temperatura (°C) *</label>
                        <input type="number" step="0.1" min="35.0" max="42.0" th:field="*{temperatura}" required
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                   <!-- Frecuencia Cardiaca: Rango pediátrico realista (40 a 220 lpm) -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Frecuencia Cardiaca (lpm)</label>
                        <input type="number" min="40" max="220" th:field="*{frecuenciaCardiaca}" placeholder="Ej. 100"
                               title="La frecuencia cardíaca pediátrica debe estar entre 40 y 220 lpm"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <!-- Presión Arterial: Formato estricto sistólica/diastólica (ej. 90/60 a 140/90) -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Presión Arterial</label>
                        <input type="text" pattern="^[0-9]{2,3}/[0-9]{2,3}$" th:field="*{presionArterial}" placeholder="Ej. 110/70"
                               title="Debe ingresar la presión en formato sistólica/diastólica (ejemplo: 110/70 o 90/60)"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <!-- Saturación de Oxígeno: Porcentaje realista (50% a 100%) -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Saturación O2 (%)</label>
                        <input type="number" min="50" max="100" th:field="*{saturacionOxigeno}" placeholder="Ej. 98"
                               title="El porcentaje de saturación de oxígeno debe ubicarse entre 50% y 100%"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
            </div>

            <!-- BLOQUE DIAGNÓSTICO Y RECETA -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-notes-medical text-indigo-600"></i> Evaluación Clínica y Prescripción
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Diagnóstico Médico *</label>
                        <textarea th:field="*{diagnostico}" rows="3" required
                                  placeholder="Detalle de hallazgos clínicos y diagnóstico..."
                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tratamiento Indicado *</label>
                        <textarea th:field="*{tratamiento}" rows="3" required
                                  placeholder="Indicaciones médicas, reposo, cuidados..."
                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Receta Médica *</label>
                        <textarea th:field="*{recetaMedica}" rows="3" required
                                  placeholder="Medicamentos, dosis, frecuencia y duración..."
                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                </div>
            </div>

            <!-- BLOQUE FIRMA DIGITAL -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-base font-bold text-slate-900 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-signature text-indigo-600"></i> Firma Digital del Médico *
                </h3>
                <p class="text-xs text-slate-500 mb-3">Firma en el recuadro con el ratón o dispositivo táctil para certificar la consulta.</p>
                <div class="border-2 border-dashed border-slate-300 rounded-lg p-2 inline-block bg-slate-50">
                    <canvas id="canvasFirma" width="450" height="150" class="bg-white rounded cursor-crosshair border border-slate-200"></canvas>
                </div>
                <div class="mt-2">
                    <button type="button" onclick="limpiarFirma()" class="text-xs text-rose-600 hover:text-rose-800 font-semibold">
                        <i class="fa-solid fa-eraser"></i> Borrar Firma
                    </button>
                </div>
                <input type="hidden" id="firmaBase64" th:field="*{firmaMedicoBase64}" required />
            </div>

            <div class="flex justify-end gap-3">
                <a th:href="@{/citas}" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition">
                    Cancelar
                </a>
                <button type="submit" onclick="guardarFirmaAntesDeEnviar(event)"
                        class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Finalizar y Guardar Consulta
                </button>
            </div>
        </form>
    </main>

    <script>
        const canvas = document.getElementById('canvasFirma');
        const ctx = canvas.getContext('2d');
        let dibujando = false;

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';

        function pos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left,
                y: (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top
            };
        }

        function empezar(e) {
            dibujando = true;
            const p = pos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            e.preventDefault();
        }

        function dibujar(e) {
            if (!dibujando) return;
            const p = pos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
            e.preventDefault();
        }

        function detener() {
            dibujando = false;
        }

        canvas.addEventListener('mousedown', empezar);
        canvas.addEventListener('mousemove', dibujar);
        window.addEventListener('mouseup', detener);

        canvas.addEventListener('touchstart', empezar);
        canvas.addEventListener('touchmove', dibujar);
        window.addEventListener('touchend', detener);

        function limpiarFirma() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('firmaBase64').value = '';
        }

        function guardarFirmaAntesDeEnviar(e) {
            const dataUrl = canvas.toDataURL('image/png');
            document.getElementById('firmaBase64').value = dataUrl;
        }
    </script>
</body>
</html>
