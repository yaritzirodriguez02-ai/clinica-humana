<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Medicamento - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Barra Superior -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-pills text-indigo-200"></i>
                <span th:text="${medicamento.idMedicamento == null ? 'Nuevo Medicamento en el Catálogo' : 'Modificar Medicamento'}"></span>
            </h1>
            <a th:href="@{/medicamentos}" class="text-sm bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg transition border border-indigo-500">
                <i class="fa-solid fa-arrow-left"></i> Volver al catálogo
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-8">
        <form th:action="@{/medicamentos/guardar}" th:object="${medicamento}" method="post"
              class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-5">
            <input type="hidden" th:field="*{idMedicamento}" />

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre Comercial *</label>
                    <input type="text" th:field="*{nombreComercial}" required maxlength="120" placeholder="Ej. Paracetamol, Amoxicilina, Lidocaína 2%"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    <span th:if="${#fields.hasErrors('nombreComercial')}" th:errors="*{nombreComercial}" class="text-xs text-rose-500"></span>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Sustancia Activa *</label>
                    <input type="text" th:field="*{sustanciaActiva}" required maxlength="120" placeholder="Ej. Paracetamol, Amoxicilina + clavulanato"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    <span th:if="${#fields.hasErrors('sustanciaActiva')}" th:errors="*{sustanciaActiva}" class="text-xs text-rose-500"></span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Presentación</label>
                    <input type="text" th:field="*{presentacion}" maxlength="80" placeholder="Ej. Suspensión oral, Jarabe, Gel tópico"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Concentración</label>
                    <input type="text" th:field="*{concentracion}" maxlength="60" placeholder="Ej. 120 mg/5 ml, 0.12%"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Categoría (especialidad de uso) *</label>
                    <select th:field="*{categoria}" required
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm font-semibold">
                        <option value="GENERAL">General (Pediatría y Odontopediatría)</option>
                        <option value="PEDIATRIA">Solo Pediatría</option>
                        <option value="ODONTOLOGIA">Solo CISO - Odontologia</option>
                    </select>
                    <p class="text-[11px] text-slate-400 mt-1">Define en qué recetas aparecerá el fármaco en el autocompletado.</p>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/medicamentos}" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Medicamento
                </button>
            </div>
        </form>
    </main>

</body>
</html>
