<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        <div class="bg-indigo-700 p-6 text-center text-white">
            <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-hospital-user text-3xl text-indigo-200"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Clínica Humana</h1>
            <p class="text-xs text-indigo-200 mt-1">Pediatría & Odontopediatría Integral</p>
        </div>

        <div class="p-8">
            <!-- Mensaje de error -->
            <div th:if="${param.error}" class="mb-4 p-3 bg-rose-50 border-l-4 border-rose-500 text-rose-700 text-xs rounded">
                <i class="fa-solid fa-triangle-exclamation"></i> Usuario o contraseña incorrectos.
            </div>

            <!-- Mensaje de cierre de sesión -->
            <div th:if="${param.logout}" class="mb-4 p-3 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 text-xs rounded">
                <i class="fa-solid fa-check"></i> Has cerrado sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre de Usuario</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" required autofocus placeholder="Ej. pilar.rios, recepcion"
                               class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" required placeholder="••••••••"
                               class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full mt-2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow text-sm transition">
                    Ingresar al Panel
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <span class="text-xs text-slate-400">Cuentas disponibles para pruebas:</span>
                <p class="text-xs text-slate-600 font-mono mt-1">pilar.rios | gloria.gonzalez | recepcion</p>
                <p class="text-xs text-slate-400 mt-0.5">Clave común: <strong>123456</strong></p>
            </div>
        </div>
    </div>

</body>
</html>
