<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prescripción de Receta Médica - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen p-6 text-slate-800">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
        <div class="flex justify-between items-center pb-4 mb-6 border-b border-slate-200">
            <div>
                <h1 class="text-xl font-black text-indigo-900 flex items-center gap-2">
                    <i class="fa-solid fa-file-prescription text-indigo-600"></i>
                    Emisión de Receta Oficial
                </h1>
                <p class="text-xs text-slate-500" th:text="'Paciente: ' + ${receta.paciente.nombre + ' ' + receta.paciente.apellidos} + ' \vert{} Especialidad: ' +${receta.cita.especialidad}"></p>
            </div>
            <a th:href="@{/citas}" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-bold">
                Volver
            </a>
        </div>

        <form th:action="@{/recetas/guardar}" th:object="${receta}" method="post" class="space-y-6">
            <input type="hidden" th:field="*{cita.idCita}">
            <input type="hidden" th:field="*{diagnosticoResumen}">
            <input type="hidden" th:field="*{firmaBase64}">

            <!-- Bloque de Medicamentos Dinámico -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <label class="text-xs font-black uppercase tracking-wider text-slate-700">Medicamentos y Dosis Prescritas</label>
                    <button type="button" onclick="agregarRenglon()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow">
                        <i class="fa-solid fa-plus"></i> Agregar Medicamento
                    </button>
                </div>

                <div id="contenedorMedicamentos" class="space-y-3">
                    <!-- Renglón 1 inicial -->
                    <div class="grid grid-cols-12 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200 items-center renglon-med">
                        <div class="col-span-4">
                            <input type="text" name="medicamento[]" placeholder="Medicamento (Ej. Paracetamol)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="presentacion[]" placeholder="Presentación (Ej. Jbe 120mg)"
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="dosis[]" placeholder="Dosis (Ej. 5 ml)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="frecuencia[]" placeholder="Cada (Ej. 8 hrs)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2 flex items-center gap-1">
                            <input type="text" name="duracion[]" placeholder="Por (Ej. 5 días)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                            <button type="button" onclick="eliminarRenglon(this)" class="text-rose-500 hover:text-rose-700 p-1 text-sm">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Indicaciones Generales -->
            <div>
                <label class="block text-xs font-black uppercase text-slate-700 mb-1">Recomendaciones e Indicaciones Generales</label>
                <textarea th:field="*{indicacionesGenerales}" rows="3" placeholder="Reposo, abundantes líquidos, evitar alimentos azucarados, técnica de cepillado..."
                          class="w-full text-xs p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                <button type="submit" class="px-6 py-2.5 bg-indigo-700 hover:bg-indigo-800 text-white rounded-xl text-sm font-bold shadow flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Guardar y Generar Receta Oficial
                </button>
            </div>
        </form>
    </div>

    <script>
        function agregarRenglon() {
            const html = `
            <div class="grid grid-cols-12 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200 items-center renglon-med">
                <div class="col-span-4">
                    <input type="text" name="medicamento[]" placeholder="Medicamento" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="col-span-2">
                    <input type="text" name="presentacion[]" placeholder="Presentación" class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                </div>
                <div class="col-span-2">
                    <input type="text" name="dosis[]" placeholder="Dosis" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                </div>
                <div class="col-span-2">
                    <input type="text" name="frecuencia[]" placeholder="Cada" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                </div>
                <div class="col-span-2 flex items-center gap-1">
                    <input type="text" name="duracion[]" placeholder="Por" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                    <button type="button" onclick="eliminarRenglon(this)" class="text-rose-500 hover:text-rose-700 p-1 text-sm">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>`;
            document.getElementById('contenedorMedicamentos').insertAdjacentHTML('beforeend', html);
        }

        function eliminarRenglon(btn) {
            const renglones = document.querySelectorAll('.renglon-med');
            if (renglones.length > 1) {
                btn.closest('.renglon-med').remove();
            } else {
                alert('Debe conservar al menos un renglón de medicamento.');
            }
        }
    </script>
</body>
</html>
