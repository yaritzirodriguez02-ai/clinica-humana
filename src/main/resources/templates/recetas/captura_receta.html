<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prescripción de Receta Médica - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen p-6 text-slate-800">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-slate-200">

        <!-- Errores de validación devueltos por el controlador -->
        <div th:if="${errorValidacion != null}" class="mb-6 p-4 bg-rose-50 border border-rose-300 rounded-xl">
            <p class="font-bold text-rose-800 text-sm flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i> No se pudo generar la receta:
            </p>
            <ul class="list-disc list-inside text-xs text-rose-700 mt-1">
                <li th:each="err : ${errorValidacion}" th:text="${err}"></li>
            </ul>
        </div>

        <!-- Errores detectados por el validador del navegador (JavaScript) -->
        <div id="erroresCaptura" class="hidden mb-6 p-4 bg-rose-50 border border-rose-300 rounded-xl">
            <p class="font-bold text-rose-800 text-sm flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i> Revise los siguientes renglones antes de guardar:
            </p>
            <ul id="listaErroresCaptura" class="list-disc list-inside text-xs text-rose-700 mt-1"></ul>
        </div>

        <div class="flex justify-between items-center pb-4 mb-6 border-b border-slate-200">
            <div>
                <h1 class="text-xl font-black text-indigo-900 flex items-center gap-2">
                    <i class="fa-solid fa-file-prescription text-indigo-600"></i>
                    Emisión de Receta Oficial
                </h1>
                <p class="text-xs text-slate-500" th:text="'Paciente: ' + ${receta.paciente.nombre + ' ' + receta.paciente.apellidos} + ' | Especialidad: ' + ${receta.cita.especialidad}"></p>
            </div>
            <div class="flex gap-2">
                <a href="https://www.google.com/search?q=vademecum+mexico+medicamentos" target="_blank" rel="noopener"
                   class="text-xs bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5">
                    <i class="fa-solid fa-up-right-from-square"></i> Vademécum / PLM
                </a>
                <a th:href="@{/citas}" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-bold">
                    Volver
                </a>
            </div>
        </div>

        <form id="formReceta" th:action="@{/recetas/guardar}" th:object="${receta}" method="post" class="space-y-6">
            <input type="hidden" th:field="*{cita.idCita}">
            <input type="hidden" th:field="*{diagnosticoResumen}">
            <input type="hidden" th:field="*{firmaBase64}">

            <!-- Catálogo de fármacos para autocompletado (Vademécum interno) -->
            <datalist id="listaMedicamentos">
                <option th:each="m : ${medicamentosCatalogo}" th:value="${m.nombreComercial}"
                        th:attr="data-presentacion=${m.presentacion},data-concentracion=${m.concentracion},data-sustancia=${m.sustanciaActiva}"
                        th:text="${m.nombreComercial + ' — ' + m.sustanciaActiva + ' ' + (m.concentracion ?: '')}">Paracetamol</option>
            </datalist>

            <!-- Bloque de Medicamentos Dinámico -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <label class="text-xs font-black uppercase tracking-wider text-slate-700">Medicamentos y Dosis Prescritas</label>
                    <button type="button" onclick="agregarRenglon()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow">
                        <i class="fa-solid fa-plus"></i> Agregar Medicamento
                    </button>
                </div>

                <div id="contenedorMedicamentos" class="space-y-3">
                    <!-- Renglón 1 inicial (solo cuando no se recuperó ningún renglón tras un error) -->
                    <div th:if="${renglones == null}" class="grid grid-cols-12 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200 items-center renglon-med">
                        <div class="col-span-3">
                            <input type="text" name="medicamento[]" list="listaMedicamentos" oninput="autoCompletarPresentacion(this)"
                                   placeholder="Del catálogo o escribir libre" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="col-span-1">
                            <a href="#" onclick="buscarVademecum(this); return false;" title="Consultar en Vademécum / PLM (abre pestaña nueva)"
                               class="w-full py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-xs flex items-center justify-center shadow">
                                <i class="fa-solid fa-up-right-from-square"></i>
                            </a>
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="presentacion[]" placeholder="Presentación (Ej. Jbe 120mg)"
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="dosis[]" placeholder="Dosis (Ej. 1 pastilla, 5 ml)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="frecuencia[]" placeholder="Cada (Ej. 8 hrs)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2 flex items-center gap-1">
                            <input type="text" name="duracion[]" placeholder="Por (Ej. 5 días)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                            <button type="button" onclick="eliminarRenglon(this)" class="text-rose-500 hover:text-rose-700 p-1 text-sm">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Renglones recuperados tras un error de validación del servidor -->
                    <div th:each="r : ${renglones}" class="grid grid-cols-12 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200 items-center renglon-med">
                        <div class="col-span-3">
                            <input type="text" name="medicamento[]" list="listaMedicamentos" oninput="autoCompletarPresentacion(this)"
                                   th:value="${r.medicamento}" placeholder="Del catálogo o escribir libre" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="col-span-1">
                            <a href="#" onclick="buscarVademecum(this); return false;" title="Consultar en Vademécum / PLM (abre pestaña nueva)"
                               class="w-full py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-xs flex items-center justify-center shadow">
                                <i class="fa-solid fa-up-right-from-square"></i>
                            </a>
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="presentacion[]" th:value="${r.presentacion}" placeholder="Presentación (Ej. Jbe 120mg)"
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="dosis[]" th:value="${r.dosis}" placeholder="Dosis (Ej. 1 pastilla, 5 ml)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2">
                            <input type="text" name="frecuencia[]" th:value="${r.frecuencia}" placeholder="Cada (Ej. 8 hrs)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                        </div>
                        <div class="col-span-2 flex items-center gap-1">
                            <input type="text" name="duracion[]" th:value="${r.duracion}" placeholder="Por (Ej. 5 días)" required
                                   class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                            <button type="button" onclick="eliminarRenglon(this)" class="text-rose-500 hover:text-rose-700 p-1 text-sm">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Indicaciones Generales -->
            <div>
                <label class="block text-xs font-black uppercase text-slate-700 mb-1">Recomendaciones e Indicaciones Generales</label>
                <textarea th:field="*{indicacionesGenerales}" rows="3" placeholder="Reposo, abundantes líquidos, evitar alimentos azucarados, técnica de cepillado..."
                          class="w-full text-xs p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
                <button type="submit" class="px-6 py-2.5 bg-indigo-700 hover:bg-indigo-800 text-white rounded-xl text-sm font-bold shadow flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Guardar y Generar Receta Oficial
                </button>
            </div>
        </form>
    </div>

    <script>
        function agregarRenglon() {
            const html = `
            <div class="grid grid-cols-12 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200 items-center renglon-med">
                <div class="col-span-3">
                    <input type="text" name="medicamento[]" list="listaMedicamentos" oninput="autoCompletarPresentacion(this)" placeholder="Del catálogo o escribir libre" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="col-span-1">
                    <a href="#" onclick="buscarVademecum(this); return false;" title="Consultar en Vademécum / PLM (abre pestaña nueva)" class="w-full py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-xs flex items-center justify-center shadow">
                        <i class="fa-solid fa-up-right-from-square"></i>
                    </a>
                </div>
                <div class="col-span-2">
                    <input type="text" name="presentacion[]" placeholder="Presentación" class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                </div>
                <div class="col-span-2">
                    <input type="text" name="dosis[]" placeholder="Dosis" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                </div>
                <div class="col-span-2">
                    <input type="text" name="frecuencia[]" placeholder="Cada" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                </div>
                <div class="col-span-2 flex items-center gap-1">
                    <input type="text" name="duracion[]" placeholder="Por" required class="w-full text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">
                    <button type="button" onclick="eliminarRenglon(this)" class="text-rose-500 hover:text-rose-700 p-1 text-sm">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>`;
            document.getElementById('contenedorMedicamentos').insertAdjacentHTML('beforeend', html);
        }

        function eliminarRenglon(btn) {
            const renglones = document.querySelectorAll('.renglon-med');
            if (renglones.length > 1) {
                btn.closest('.renglon-med').remove();
            } else {
                alert('Debe conservar al menos un renglón de medicamento.');
            }
        }

        // Abre Vademécum / PLM en pestaña nueva con el nombre del medicamento del renglón
        function buscarVademecum(btn) {
            const fila = btn.closest('.renglon-med');
            const nombre = fila.querySelector('input[name="medicamento[]"]').value.trim();
            const consulta = nombre ? 'vademecum ' + nombre : 'vademecum mexico medicamentos pediatricos';
            window.open('https://www.google.com/search?q=' + encodeURIComponent(consulta), '_blank');
        }

        // Autocompleta presentación y concentración al elegir un fármaco del catálogo
        function autoCompletarPresentacion(input) {
            const valor = input.value.trim().toLowerCase();
            if (!valor) { return; }
            const opcion = Array.from(document.querySelectorAll('#listaMedicamentos option'))
                .find(o => o.value.toLowerCase() === valor);
            if (!opcion) { return; }
            const fila = input.closest('.renglon-med');
            const campoPresentacion = fila.querySelector('input[name="presentacion[]"]');
            if (campoPresentacion && !campoPresentacion.value.trim()) {
                const partes = [opcion.getAttribute('data-presentacion'), opcion.getAttribute('data-concentracion')]
                    .filter(p => p);
                campoPresentacion.value = partes.join(' ');
            }
        }

        // =================== CANDADAS DE VALIDACIÓN DE LA RECETA ===================
        const RE_FRECUENCIA = /^(?:cada\s+|c\/\s*|q)?\d{1,3}(?:\s*-\s*\d{1,3})?\s*(?:horas?|hrs?|h|d[ií]as?|d|semanas?|minutos?|min)$/i;
        const RE_DURACION = /^(?:por\s+)?\d{1,3}(?:\s*-\s*\d{1,3})?\s*(?:d[ií]as?|d|semanas?|meses)$/i;
        const RE_MEDICAMENTO = /^[\p{L}\d][\p{L}\d \-().,%'\/]{2,119}$/u;
        const RE_BASE = /([a-záéíóúüñ]{2,5})\1{3,}/i;

        function medicamentoValido(m) {
            const v = (m || '').trim();
            if (!RE_MEDICAMENTO.test(v)) return false;
            if (RE_BASE.test(v)) return false;
            let letras = 0;
            for (const p of v.split(/\s+/)) {
                if (p.length > 30) return false;
                const solo = p.replace(/[^\p{L}]/gu, '');
                letras += solo.length;
                if (solo.length >= 4 && !/[aeiouáéíóúü]/i.test(solo)) return false;
            }
            return letras >= 4;
        }

        function recomendacionValida(txt) {
            const v = (txt || '').trim();
            if (v.length < 15) return false;
            const palabras = v.split(/\s+/);
            if (palabras.length < 3) return false;
            if (palabras.some(p => p.length > 22)) return false;
            if (RE_BASE.test(v)) return false;
            let letras = 0;
            for (const p of palabras) {
                const solo = p.replace(/[^\p{L}]/gu, '');
                letras += solo.length;
                if (solo.length >= 4 && !/[aeiouáéíóúü]/i.test(solo)) return false;
            }
            return letras >= 8;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const catalogo = new Set(Array.from(document.querySelectorAll('#listaMedicamentos option'))
                .map(o => o.value.trim().toLowerCase()));
            const form = document.getElementById('formReceta');
            form.addEventListener('submit', function (ev) {
                const errores = [];
                let indice = 0;
                document.querySelectorAll('.renglon-med').forEach(fila => {
                    indice++;
                    const med = fila.querySelector('input[name="medicamento[]"]');
                    const dosis = fila.querySelector('input[name="dosis[]"]');
                    const frec = fila.querySelector('input[name="frecuencia[]"]');
                    const dur = fila.querySelector('input[name="duracion[]"]');
                    [med, dosis, frec, dur].forEach(c => c && c.classList.remove('border-rose-500'));

                    const nombre = med ? med.value.trim() : '';
                    if (!nombre) {
                        errores.push('Renglón ' + indice + ': debe indicar el medicamento.');
                        if (med) med.classList.add('border-rose-500');
                    } else if (!medicamentoValido(nombre)) {
                        errores.push('Renglón ' + indice + ': "' + nombre + '" no es un nombre de fármaco válido. Use el catálogo o un nombre real del vademécum, sin texto aleatorio.');
                        med.classList.add('border-rose-500');
                    } else if (!catalogo.has(nombre.toLowerCase())) {
                        const continuar = confirm('El medicamento "' + nombre + '" no está en el catálogo interno de la clínica.\n\n¿Desea prescribirlo de todos modos?');
                        if (!continuar) {
                            errores.push('Renglón ' + indice + ': "' + nombre + '" fue rechazado (no pertenece al catálogo de medicamentos).');
                            med.classList.add('border-rose-500');
                        }
                    }

                    if (dosis && !dosis.value.trim()) {
                        errores.push('Renglón ' + indice + ': debe indicar la dosis (ej. 1 pastilla, 1 ampolleta, 5 ml).');
                        dosis.classList.add('border-rose-500');
                    }
                    if (frec && !RE_FRECUENCIA.test(frec.value.trim())) {
                        errores.push('Renglón ' + indice + ': la frecuencia "' + frec.value.trim() + '" no tiene formato coherente (ej. cada 8 horas, 8 hrs, c/8h).');
                        frec.classList.add('border-rose-500');
                    }
                    if (dur && !RE_DURACION.test(dur.value.trim())) {
                        errores.push('Renglón ' + indice + ': la duración "' + dur.value.trim() + '" no tiene formato coherente (ej. por 5 días).');
                        dur.classList.add('border-rose-500');
                    }
                });

                const ind = document.getElementById('indicacionesGenerales');
                if (ind) {
                    ind.classList.remove('border-rose-500');
                    if (ind.value.trim() && !recomendacionValida(ind.value)) {
                        errores.push('Las Recomendaciones e Indicaciones Generales deben ser texto descriptivo real (mínimo 3 palabras coherentes, sin letras repetidas ni cadenas aleatorias).');
                        ind.classList.add('border-rose-500');
                    }
                }

                const cont = document.getElementById('erroresCaptura');
                const ul = document.getElementById('listaErroresCaptura');
                ul.innerHTML = '';
                if (errores.length > 0) {
                    ev.preventDefault();
                    errores.forEach(msg => {
                        const li = document.createElement('li');
                        li.textContent = msg;
                        ul.appendChild(li);
                    });
                    cont.classList.remove('hidden');
                    cont.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    cont.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
