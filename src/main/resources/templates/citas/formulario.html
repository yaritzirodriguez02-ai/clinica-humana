<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Barra de Navegación Global Unificada -->
    <div th:replace="~{fragments/navbar :: barraNavegacion}"></div>

    <main class="max-w-3xl mx-auto px-4 mt-8">
        
        <!-- Error por colisión de horario o validación de reglas de negocio -->
        <div th:if="${errorHorario}" class="mb-6 p-4 bg-rose-100 border-l-4 border-rose-500 text-rose-800 rounded shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-rose-600"></i>
            <span th:text="${errorHorario}"></span>
        </div>

        <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            
            <div class="border-b border-slate-200 pb-3 mb-2 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-black text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-plus text-indigo-600"></i>
                        Programación de Consulta Médica
                    </h2>
                    <p class="text-xs text-slate-500">Asigna fecha, especialista y datos del paciente bajo el horario oficial.</p>
                </div>
                <a th:href="@{/citas}" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-bold transition">
                    Volver a Agenda
                </a>
            </div>

            <!-- Paciente -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Seleccionar Paciente *</label>
                <select th:field="*{paciente.idPaciente}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                    <option value="">-- Selecciona un paciente registrado --</option>
                    <option th:each="pac : ${pacientes}" th:value="${pac.idPaciente}" th:text="${pac.nombre + ' ' + pac.apellidos + ' (CURP: ' + pac.curp + ')'}"></option>
                </select>
            </div>

            <!-- Especialidad -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Especialidad Requerida *</label>
                <select th:field="*{especialidad}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                    <option value="PEDIATRIA">Pediatría General</option>
                    <option value="ODONTOPEDIATRIA">Odontopediatría Dental</option>
                </select>
            </div>

            <!-- Especialista Médico -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Médico Asignado *</label>
                <select th:field="*{medico.idUsuario}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                    <option value="">-- Selecciona el especialista --</option>
                    <option th:each="m : ${medicos}" th:value="${m.idUsuario}" th:text="${m.nombreCompleto + ' (' + m.rol + ')'}"></option>
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Fecha restringida con mínimo del día actual -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Fecha de la Cita *</label>
                    <input type="date" id="campoFecha" th:field="*{fecha}" required 
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
                    <span class="text-[10px] text-slate-400">Sólo fechas vigentes (a partir de hoy).</span>
                </div>

                <!-- Horario Clínico Restringido (09:00 a 19:00 hrs) -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Horario de Consulta *</label>
                    <select th:field="*{hora}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm font-mono font-bold">
                        <option value="">-- Selecciona Horario --</option>
                        <option value="09:00">09:00 AM</option>
                        <option value="09:30">09:30 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="10:30">10:30 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="11:30">11:30 AM</option>
                        <option value="12:00">12:00 PM</option>
                        <option value="12:30">12:30 PM</option>
                        <option value="13:00">01:00 PM</option>
                        <option value="13:30">01:30 PM</option>
                        <option value="14:00">02:00 PM</option>
                        <option value="16:00">04:00 PM</option>
                        <option value="16:30">04:30 PM</option>
                        <option value="17:00">05:00 PM</option>
                        <option value="17:30">05:30 PM</option>
                        <option value="18:00">06:00 PM</option>
                        <option value="18:30">06:30 PM</option>
                        <option value="19:00">07:00 PM</option>
                    </select>
                    <span class="text-[10px] text-slate-400">Atención de 09:00 AM a 07:00 PM.</span>
                </div>
            </div>

            <!-- Motivo de la Cita con validación de longitud -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Motivo de la Cita *</label>
                <textarea th:field="*{motivo}" required minlength="10" maxlength="255" rows="3"
                          placeholder="Ej. Control de niño sano y esquema de vacunación, valoración de caries dental en molar..."
                          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                <div class="flex justify-between items-center text-[10px] text-slate-400 mt-0.5">
                    <span>Especifique el cuadro o causa médica (mínimo 10 caracteres).</span>
                </div>
            </div>

            <!-- Acciones -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/citas}" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-bold transition">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check"></i> Confirmar Cita
                </button>
            </div>
        </form>
    </main>

    <!-- Script de Bloqueo de Días Pasados -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const inputFecha = document.getElementById("campoFecha");
            if (inputFecha) {
                const hoy = new Date();
                const anio = hoy.getFullYear();
                const mes = String(hoy.getMonth() + 1).padStart(2, '0');
                const dia = String(hoy.getDate()).padStart(2, '0');
                const fechaMinima = `${anio}-${mes}-${dia}`;
                inputFecha.min = fechaMinima;
            }
        });
    </script>

</body>
</html>
