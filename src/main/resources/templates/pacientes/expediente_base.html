<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloPagina}">Expediente Clínico del Paciente - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

<div th:replace="~{fragments/navbar :: barraNavegacion}"></div>

<main class="max-w-6xl mx-auto px-4 py-8">
    <div th:if="${mensajeExito}" class="mb-6 p-4 bg-emerald-100 border-l-4 border-emerald-500 text-emerald-800 rounded shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-600"></i>
            <span th:text="${mensajeExito}"></span>
        </div>
    </div>
    <div th:if="${mensajeError}" class="mb-6 p-4 bg-rose-100 border-l-4 border-rose-500 text-rose-800 rounded shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-rose-600"></i>
            <span th:text="${mensajeError}"></span>
        </div>
    </div>

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <div>
            <h2 class="text-2xl font-extrabold uppercase tracking-tight text-slate-900" th:text="${tituloPagina}"></h2>
            <p class="text-sm font-medium uppercase tracking-wide text-slate-500" th:text="${subtituloPagina}"></p>
        </div>
        <a th:href="${linkVolver}" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Volver
        </a>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-start gap-4">                        <div class="flex items-start gap-4">
            <!-- Foto perfil del paciente (recuadro circular con silueta por defecto) -->
            <div class="relative shrink-0">
                <div class="w-16 h-16 rounded-full bg-gradient-to-br from-slate-200 to-slate-300 border-2 border-slate-400 flex items-center justify-center text-slate-500 shadow-inner">
                    <svg class="w-8 h-8 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4.418 3.582-8 8-8s8 3.582 8 8"/>
                    </svg>
                </div>
                <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white shadow-sm"></div>
            </div>
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-blue-800">Paciente</span>
                <h3 class="text-xl font-bold text-slate-900" th:text="${nombrePaciente}"></h3>
                <p class="text-xs text-slate-500 font-mono" th:text="${datosPaciente}"></p>
            </div>
        </div>
        <div class="bg-slate-50 px-4 py-2 rounded-lg text-sm border border-slate-200">
            <span class="font-semibold text-slate-700">Tutor:</span>
            <span th:text="${datosTutor}"></span>
        </div>
    </div>

    <!-- GALERÍA DE TRATAMIENTOS CLÍNICOS -->
    <section class="mb-10">
        <div class="flex items-center gap-3 mb-4">
            <i class="fa-solid fa-images text-blue-800 text-xl"></i>
            <h3 class="text-lg font-bold uppercase tracking-widest text-slate-900">Galería de Tratamientos Clínicos</h3>
            <span class="text-xs uppercase tracking-widest font-medium text-slate-500 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-full">Opcional</span>
        </div>

        <div class="bg-white rounded-xl border border-dashed border-slate-300 p-6 text-center">
            <div class="flex flex-wrap justify-center gap-4">
                <div class="flex flex-col items-center gap-2">
                    <div class="aspect-square w-28 h-28 rounded-lg bg-slate-50 border-2 border-slate-200 flex items-center justify-center">
                        <svg class="w-8 h-8 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="17" rx="2" ry="2"/>
                            <path d="M7 16l4-4 4 4 5-5"/>
                        </svg>
                    </div>
                    <span class="text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Radiografías</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="aspect-square w-28 h-28 rounded-lg bg-slate-50 border-2 border-slate-200 flex items-center justify-center">
                        <svg class="w-8 h-8 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 16l4-4 4 4 4-4 4 4"/>
                            <path d="M12 8v8"/>
                        </svg>
                    </div>
                    <span class="text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Endodoncias</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="aspect-square w-28 h-28 rounded-lg bg-slate-50 border-2 border-slate-200 flex items-center justify-center">
                        <svg class="w-8 h-8 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="7 17 12 12 17 17"/>
                            <polyline points="7 12 12 7 17 12"/>
                        </svg>
                    </div>
                    <span class="text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Evoluciones</span>
                </div>
            </div>
            <p class="mt-3 text-xs text-slate-400">Espacio reservado para imágenes clínicas del paciente (radiografías, endodoncias, evoluciones dentales).</p>
        </div>
    </section>

    <section th:replace="${vistaEspecialidad} :: bloqueHistorial"></section>
</main>

</body>
</html>
