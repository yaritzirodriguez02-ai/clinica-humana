<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloPagina}">Expediente Clínico del Paciente - Clínica Humana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

<div th:replace="~{fragments/navbar :: barraNavegacion}"></div>

<main class="max-w-6xl mx-auto px-4 py-8">
    <div th:if="${mensajeExito}" class="mb-6 p-4 bg-emerald-100 border-l-4 border-emerald-500 text-emerald-800 rounded shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-600"></i>
            <span th:text="${mensajeExito}"></span>
        </div>
    </div>
    <div th:if="${mensajeError}" class="mb-6 p-4 bg-rose-100 border-l-4 border-rose-500 text-rose-800 rounded shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-rose-600"></i>
            <span th:text="${mensajeError}"></span>
        </div>
    </div>

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <div>
            <h2 class="text-2xl font-bold text-slate-900" th:text="${tituloPagina}"></h2>
            <p class="text-sm text-slate-500" th:text="${subtituloPagina}"></p>
        </div>
        <a th:href="${linkVolver}" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Volver
        </a>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-start gap-4">
        <div>
            <span class="text-xs font-semibold text-indigo-600 uppercase">Paciente</span>
            <h3 class="text-xl font-bold text-slate-900" th:text="${nombrePaciente}"></h3>
            <p class="text-xs text-slate-500 font-mono" th:text="${datosPaciente}"></p>
        </div>
        <div class="bg-slate-100 px-4 py-2 rounded-lg text-sm">
            <span class="font-semibold text-slate-700">Tutor:</span>
            <span th:text="${datosTutor}"></span>
        </div>
    </div>

    <section th:replace="${vistaEspecialidad} :: bloqueHistorial"></section>

    <p class="text-xs text-slate-400 text-center pt-4 border-t border-slate-200">
        <i class="fa-solid fa-clock mr-1"></i> Las fechas mostradas corresponden a la fecha de atención registrada en cada expediente.
    </p>
</main>

</body>
</html>
