<div th:fragment="bloqueHistorial">
    <section class="mb-8">
        <div class="flex items-center gap-3 mb-4">
            <i class="fa-solid fa-stethoscope text-indigo-600 text-xl"></i>
            <h3 class="text-lg font-bold text-slate-900">Atenciones Pediátricas</h3>
            <span class="text-xs text-slate-400 font-medium bg-slate-100 px-2 py-0.5 rounded-full"
                  th:text="${'Total: ' + (historiaPediatrica != null ? historiaPediatrica.size() : 0)}"></span>
        </div>

        <div th:if="${#lists.isEmpty(historiaPediatrica)}" class="bg-white p-6 rounded-xl border border-dashed border-slate-300 text-slate-400 text-sm">
            <i class="fa-solid fa-notes-medical text-2xl mb-2 block opacity-50"></i>
            No hay atenciones pediátricas registradas para este paciente.
        </div>

        <div th:if="${not #lists.isEmpty(historiaPediatrica)}" class="space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200" th:each="exp, iter : ${historiaPediatricaCronologica}">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3 mb-3">
                    <div>
                        <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                            <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-semibold">PEDIATRÍA</span>
                            <span class="text-slate-500" th:text="${'Atención #' + (iter.index + 1)}"></span>
                        </div>
                        <span class="text-sm font-semibold text-slate-800" th:text="${#temporals.format(exp.fechaAtencion, 'dd MMMM yyyy')}"></span>
                        <span class="text-xs text-slate-400" th:text="${'• ' + #temporals.format(exp.fechaAtencion, 'HH:mm')}"></span>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-xs text-slate-400 mb-0.5">Médico/a Pediatra</div>
                        <div class="text-sm font-medium text-slate-900" th:text="${exp.medico.nombreCompleto}"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 ml-0 sm:ml-[110px]">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Diagnóstico Médico</label>
                        <p class="text-sm text-slate-800 leading-relaxed whitespace-pre-wrap" th:text="${exp.diagnostico}">—</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tratamiento Indicado</label>
                        <p class="text-sm text-slate-800 leading-relaxed whitespace-pre-wrap" th:text="${exp.tratamiento}">—</p>
                    </div>
                </div>

                <div class="mt-4 ml-0 sm:ml-[110px] flex flex-wrap gap-2 justify-end">
                    <a th:href="@{/consultas/pediatria/expediente/editar/{idExpediente}(idPaciente=${idPaciente}, idExpediente=${exp.idExpedientePed})}"
                       class="text-amber-700 hover:text-amber-900 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg text-xs font-medium inline-flex items-center gap-1 transition">
                        <i class="fa-solid fa-pen-to-square"></i> Editar
                    </a>
                    <form th:action="@{/consultas/pediatria/expediente/eliminar/{idExpediente}(idPaciente=${idPaciente}, idExpediente=${exp.idExpedientePed})}" method="post" class="inline">
                        <button type="submit" class="text-rose-700 hover:text-rose-900 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg text-xs font-medium inline-flex items-center gap-1 transition"
                                onclick="return confirm('¿Eliminar esta atención pediátrica del historial?')">
                        <i class="fa-solid fa-trash-can"></i> Eliminar
                    </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="mt-6 flex justify-end">
            <a th:href="@{/consultas/pediatria/expediente/nuevo/{idPaciente}(idPaciente=${idPaciente})}"
               class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow">
                <i class="fa-solid fa-plus"></i> Nueva Atención Pediátrica
            </a>
        </div>
    </section>
</div>
