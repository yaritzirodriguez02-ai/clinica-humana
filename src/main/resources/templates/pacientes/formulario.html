<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro / Edición de Paciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Barra Superior -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-hospital-user text-indigo-200"></i>
                <span th:text="${paciente.idPaciente == null ? 'Nuevo Paciente Pediátrico' : 'Modificar Datos de Paciente'}"></span>
            </h1>
            <a th:href="@{/pacientes}" class="text-sm bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg transition border border-indigo-500">
                <i class="fa-solid fa-arrow-left"></i> Volver a la lista
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-8">
        
        <!-- Error Unicidad CURP -->
        <div th:if="${errorCurp}" class="mb-6 p-4 bg-rose-100 border-l-4 border-rose-500 text-rose-800 rounded shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-rose-600"></i>
            <span th:text="${errorCurp}"></span>
        </div>

        <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" class="space-y-6">
            <input type="hidden" th:field="*{idPaciente}" />

            <!-- BLOQUE 1: DATOS DEL PACIENTE -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-child text-indigo-600"></i> Datos del Infante (Paciente)
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre(s) *</label>
                        <input type="text" th:field="*{nombre}" required
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-xs text-rose-500"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Apellidos *</label>
                        <input type="text" th:field="*{apellidos}" required
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        <span th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="text-xs text-rose-500"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">CURP (18 caracteres) *</label>
                        <input type="text" th:field="*{curp}" maxlength="18" required
                               class="w-full px-3 py-2 uppercase font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        <span th:if="${#fields.hasErrors('curp')}" th:errors="*{curp}" class="text-xs text-rose-500"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha de Nacimiento *</label>
                        <input type="date" th:field="*{fechaNacimiento}" required
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        <span th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}" class="text-xs text-rose-500"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Sexo *</label>
                        <select th:field="*{sexo}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipo de Sangre</label>
                        <input type="text" th:field="*{tipoSangre}" placeholder="Ej: O+, A+, B-"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Alergias Conocidas</label>
                        <textarea th:field="*{alergias}" rows="2" placeholder="Penicilina, polen, etc."
                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Antecedentes Médicos Relevantes</label>
                        <textarea th:field="*{antecedentes}" rows="2" placeholder="Enfermedades crónicas, cirugías previas, etc."
                                  class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- BLOQUE 2: DATOS DEL TUTOR LEGAL -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-indigo-600"></i> Datos del Tutor Legal Responsable
                </h2>
                <input type="hidden" th:field="*{tutor.idTutor}" />

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre del Tutor *</label>
                        <input type="text" th:field="*{tutor.nombre}" required
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Apellidos del Tutor *</label>
                        <input type="text" th:field="*{tutor.apellidos}" required
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Parentesco *</label>
                        <select th:field="*{tutor.parentesco}" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                            <option value="Madre">Madre</option>
                            <option value="Padre">Padre</option>
                            <option value="Abuelo/a">Abuelo/a</option>
                            <option value="Tutor Legal">Tutor Legal</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Teléfono (10 dígitos) *</label>
                        <input type="tel" th:field="*{tutor.telefono}" maxlength="10" required
                               class="w-full px-3 py-2 font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                        <input type="email" th:field="*{tutor.email}"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Dirección / Domicilio</label>
                        <input type="text" th:field="*{tutor.direccion}"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                    </div>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="flex justify-end gap-3">
                <a th:href="@{/pacientes}" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Registro
                </button>
            </div>
        </form>
    </main>

</body>
</html>
