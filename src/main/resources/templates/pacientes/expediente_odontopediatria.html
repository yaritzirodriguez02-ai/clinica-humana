<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Expediente Odontologico - Clinica Humana</title>
</head>
<body>

<div sec:authorize="hasAnyRole('ODONTOLOGIA', 'RECEPCIONISTA', 'ADMIN')" class="mt-8 bg-white rounded-xl border border-slate-200 shadow-sm">
    <div class="p-6 border-b border-slate-200">
        <h3 class="text-lg font-bold text-slate-800">Atencion Odontologica</h3>
    </div>

    <div th:each="exp : ${expedientesOdontologicos}" class="p-4 border-b border-slate-100 hover:bg-slate-50">
        <div class="flex items-start justify-between">
            <div>
                <p class="text-sm text-slate-600">Fecha: <span th:text="${#temporals.format(exp.fechaAtencion, 'dd/MM/yyyy HH:mm')}">--</span></p>
                <p class="text-sm text-slate-500" th:text="'Dr(a). ' + ${exp.medico.nombreCompleto}">Medico</p>
            </div>
            <div class="flex gap-3" th:if="${exp.medico != null and exp.medico.rol == 'ODONTOLOGIA'}">
                <a th:href="@{/consultas/odontologia/expediente/editar/{idExpediente}(idPaciente=${idPaciente}, idExpediente=${exp.idExpedienteOdonto})}"
                   class="text-blue-700 hover:underline text-xs">Editar</a>
                <form th:action="@{/consultas/odontologia/expediente/eliminar/{idExpediente}(idPaciente=${idPaciente}, idExpediente=${exp.idExpedienteOdonto})}" method="post" class="inline">
                    <button type="submit" class="text-red-600 hover:text-red-800 text-xs">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
