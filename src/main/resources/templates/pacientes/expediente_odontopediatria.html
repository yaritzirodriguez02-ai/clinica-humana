<div th:fragment="bloqueHistorial">
    <section class="mb-8">
        <div class="flex items-center gap-3 mb-4">
            <i class="fa-solid fa-tooth text-teal-600 text-xl"></i>
            <h3 class="text-lg font-bold text-slate-900">Atenciones Odontopediátricas</h3>
            <span class="text-xs text-slate-400 font-medium bg-slate-100 px-2 py-0.5 rounded-full"
                  th:text="${'Total: ' + (historiaOdontopediatrica != null ? historiaOdontopediatrica.size() : 0)}"></span>
        </div>

        <div th:if="${#lists.isEmpty(historiaOdontopediatrica)}" class="bg-white p-6 rounded-xl border border-dashed border-slate-300 text-slate-400 text-sm">
            <i class="fa-solid fa-file-medical text-2xl mb-2 block opacity-50"></i>
            No hay atenciones odontopediátricas registradas para este paciente.
        </div>

        <div th:if="${not #lists.isEmpty(historiaOdontopediatrica)}" class="space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200" th:each="exp, iter : ${historiaOdontopediatricaCronologica}">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3 mb-3">
                    <div>
                        <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                            <span class="bg-teal-100 text-teal-700 px-2 py-0.5 rounded-full font-semibold">ODONTOPEDIATRÍA</span>
                            <span class="text-slate-500" th:text="${'Atención #' + (iter.index + 1)}"></span>
                        </div>
                        <span class="text-sm font-semibold text-slate-800" th:text="${#temporals.format(exp.fechaAtencion, 'dd MMMM yyyy')}"></span>
                        <span class="text-xs text-slate-400" th:text="${'• ' + #temporals.format(exp.fechaAtencion, 'HH:mm')}"></span>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-xs text-slate-400 mb-0.5">Odontopediatra</div>
                        <div class="text-sm font-medium text-slate-900" th:text="${exp.medico.nombreCompleto}"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 ml-0 sm:ml-[110px]">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Diagnóstico Dental</label>
                        <p class="text-sm text-slate-800 leading-relaxed whitespace-pre-wrap" th:text="${exp.diagnosticoDental}">—</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Procedimientos Realizados</label>
                        <p class="text-sm text-slate-800 leading-relaxed whitespace-pre-wrap" th:text="${exp.procedimientosRealizados}">—</p>
                    </div>
                </div>

                <div class="mt-3 ml-0 sm:ml-[110px] text-xs text-slate-500 space-y-1">
                    <div class="flex justify-between">
                        <span>Piezas tratadas:</span>
                        <span class="font-medium text-slate-700" th:text="${exp.piezasTratadas != null ? exp.piezasTratadas : 'N/A'}">—</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Costo del tratamiento:</span>
                        <span class="font-medium text-slate-700" th:text="${'$' + #numbers.formatDecimal(exp.costoTratamiento, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                    </div>
                </div>

                <div class="mt-4 ml-0 sm:ml-[110px] flex flex-wrap gap-2 justify-end">
                    <a th:href="@{/consultas/odontopediatria/expediente/editar/{idExpediente}(idPaciente=${idPaciente}, idExpediente=${exp.idExpedienteOdonto})}"
                       class="text-amber-700 hover:text-amber-900 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg text-xs font-medium inline-flex items-center gap-1 transition">
                        <i class="fa-solid fa-pen-to-square"></i> Editar
                    </a>
                    <form th:action="@{/consultas/odontopediatria/expediente/eliminar/{idExpediente}(idPaciente=${idPaciente}, idExpediente=${exp.idExpedienteOdonto})}" method="post" class="inline">
                        <button type="submit" class="text-rose-700 hover:text-rose-900 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg text-xs font-medium inline-flex items-center gap-1 transition"
                                onclick="return confirm('¿Eliminar esta atención odontopediátrica del historial?')">
                        <i class="fa-solid fa-trash-can"></i> Eliminar
                    </button>
                    </form>
                </div>
            </div>
        </div>

    </section>
</div>
