<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 1000" preserveAspectRatio="xMidYMid slice" width="280" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#020b16"/>
      <stop offset="0.42" stop-color="#051d2b"/>
      <stop offset="0.72" stop-color="#072536"/>
      <stop offset="1" stop-color="#020a14"/>
    </linearGradient>

    <radialGradient id="haloCyan" cx="0.3" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#38d9f2" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#0e7f9c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloMagenta" cx="0.28" cy="0.78" r="0.6">
      <stop offset="0" stop-color="#c33fa8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="toothFill" cx="0.42" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#e2fbff"/>
      <stop offset="0.72" stop-color="#7ee4f7"/>
      <stop offset="1" stop-color="#2fa8cc"/>
    </radialGradient>

    <radialGradient id="toothGlow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#8ff3ff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#2bc4e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a2a3a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waveA" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#63f0ff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#63f0ff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#3fc9ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3fc9ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveB" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6fd8" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ff6fd8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blurFine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="glowTooth" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="280" height="1000" fill="url(#bg)"/>
  <rect width="280" height="1000" fill="url(#haloCyan)"/>
  <rect width="280" height="1000" fill="url(#haloMagenta)"/>

  <!-- Cortinas de luz -->
  <g fill="none" filter="url(#blurSoft)" stroke-linecap="round">
    <path d="M-30 90 C 90 190, 10 300, 96 402 S 20 600, 104 720 S 34 900, 120 1010" stroke="url(#waveA)" stroke-width="26" opacity="0.55"/>
    <path d="M60 -40 C 170 90, 80 210, 176 330 S 96 540, 190 660 S 110 870, 196 1010" stroke="url(#waveA)" stroke-width="12" opacity="0.5"/>
    <path d="M-40 380 C 80 470, 30 620, 150 700 S 80 860, 170 980" stroke="url(#waveB)" stroke-width="30" opacity="0.5"/>
    <path d="M200 -30 C 120 140, 220 250, 150 390 S 240 560, 168 700 S 250 880, 186 1010" stroke="url(#waveA)" stroke-width="8" opacity="0.45"/>
  </g>

  <!-- Diente luminoso -->
  <ellipse cx="140" cy="742" rx="120" ry="118" fill="url(#toothGlow)"/>
  <g filter="url(#glowTooth)">
    <path d="M168 596c-22-14-52-16-74-2-26 16-34 50-24 80 7 21 20 30 24 52 3 15 5 34 15 34s11-17 14-34c3-16 8-26 22-26s19 10 22 26c3 17 5 34 15 34s12-19 15-34c4-22 17-31 24-52 10-30 2-64-24-80-22-14-52-12-74 2z"
          fill="url(#toothFill)" opacity="0.96"/>
    <path d="M168 596c-22-14-52-16-74-2-26 16-34 50-24 80 7 21 20 30 24 52 3 15 5 34 15 34s11-17 14-34c3-16 8-26 22-26s19 10 22 26c3 17 5 34 15 34s12-19 15-34c4-22 17-31 24-52 10-30 2-64-24-80-22-14-52-12-74 2z"
          fill="none" stroke="#eaffff" stroke-width="2" opacity="0.75"/>
  </g>
  <ellipse cx="116" cy="632" rx="16" ry="26" fill="#ffffff" opacity="0.6" filter="url(#blurFine)" transform="rotate(-18 116 632)"/>

  <!-- Destellos -->
  <g fill="#dffaff">
    <circle cx="62" cy="240" r="1.8" opacity="0.9"/>
    <circle cx="214" cy="330" r="1.4" opacity="0.75"/>
    <circle cx="42" cy="520" r="1.6" opacity="0.7"/>
    <circle cx="232" cy="562" r="2" opacity="0.8"/>
    <circle cx="76" cy="880" r="1.5" opacity="0.65"/>
    <circle cx="198" cy="912" r="1.8" opacity="0.7"/>
    <circle cx="130" cy="118" r="1.3" opacity="0.6"/>
    <circle cx="246" cy="760" r="1.4" opacity="0.6"/>
    <circle cx="28" cy="700" r="1.2" opacity="0.55"/>
  </g>
</svg>
