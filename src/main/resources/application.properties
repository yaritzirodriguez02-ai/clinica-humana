spring.application.name=clinica-humana

# Conexión a MySQL (phpMyAdmin)
spring.datasource.url=jdbc:mysql://localhost:3306/clinica_humana_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Carga de fotos del paciente (placas, radiografías, retrato)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Sitio web de CISO que se imprime en la portada del carnet de citas del consultorio.
# Se deja VACÍO por ahora: al publicar el sitio basta escribir aquí la URL
# (por ejemplo https://www.cisodontologicos.com) y aparecerá en los carnets nuevos.
ciso.sitio.web=

# ---------------------------------------------------------------------------
# Notificaciones de citas por WhatsApp y SMS (Twilio)
# ---------------------------------------------------------------------------
# Si dejas las credenciales vacías, el sistema sigue funcionando en MODO SIMULADO:
# el mensaje completo se escribe en el log y queda registrado en la tabla
# notificaciones_cita con estado SIMULADO (útil para revisar el texto antes de pagar).
# Para activarlo, crea una cuenta en https://www.twilio.com, compra un número con
# capacidad SMS y WhatsApp y pega aquí los datos (o define las variables de entorno).
notificaciones.habilitadas=true
notificaciones.sms.habilitado=true
notificaciones.whatsapp.habilitado=true

# Recordatorio automático: todos los días a las 07:00 (hora de Chilpancingo)
notificaciones.recordatorio.cron=0 0 7 * * *
notificaciones.recordatorio.zona=America/Mexico_City

twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# Número emisor en formato E.164, por ejemplo +527471234567
# Twilio exige que el número tenga capacidad de SMS y esté dado de alta en México.
twilio.sms.from=${TWILIO_SMS_FROM:}
# Remitente de WhatsApp: sandbox "whatsapp:+14155238886" o tu número aprobado "whatsapp:+52747..."
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}

# Puerto del servidor
server.port=8080